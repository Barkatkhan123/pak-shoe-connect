name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. QUALITY ASSURANCE & AUTOMATED TESTING
  # ──────────────────────────────────────────────────────────
  quality-and-test:
    name: 1. Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Type Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Run Vitest Unit & Integration Suite
        run: npx vitest run

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Full Production Bundle
        run: |
          npm run build
          node scripts/build-spa-bundle.mjs

      - name: Verify Build Artifacts
        run: |
          test -f dist/client/index.html || exit 1
          test -f dist/client/assets/app-v3.js || exit 1
          echo "✅ Production artifacts verified successfully!"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-client-build
          path: dist/client/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 2. SECURITY SCANNING & SBOM
  # ──────────────────────────────────────────────────────────
  security-audit:
    name: 2. DevSecOps Audit & Container Scan
    needs: quality-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Run Filesystem Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "sbom.spdx.json"

  # ──────────────────────────────────────────────────────────
  # 3. DOCKER BUILD & REGISTRY PUSH
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: 3. Docker Container Build
    needs: quality-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: anamon-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # 4. HOSTINGER AUTOMATED MULTI-DOMAIN DEPLOYMENT
  # ──────────────────────────────────────────────────────────
  deploy-hostinger:
    name: 4. Hostinger Live Deployment
    needs: [quality-and-test, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-client-build
          path: dist/client/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FTP Deployment Client
        run: npm install basic-ftp

      - name: Deploy to Hostinger All Domains
        run: node scripts/deploy-ftp-v2.mjs
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST || '145.79.26.180' }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER || 'u988207622' }}
          HOSTINGER_FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASS }}

  # ──────────────────────────────────────────────────────────
  # 5. VERCEL PRODUCTION DEPLOYMENT
  # ──────────────────────────────────────────────────────────
  deploy-vercel:
    name: 5. Vercel Cloud Deployment
    needs: [quality-and-test, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HAS_VERCEL == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
