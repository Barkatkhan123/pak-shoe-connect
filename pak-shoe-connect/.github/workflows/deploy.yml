name: DevSecOps CI/CD Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 1. Code Quality, Build & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Type Compliance
        run: npx tsc --noEmit --skipLibCheck

      - name: Run Vitest Unit & Integration Suite
        run: npx vitest run

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f dist/server/server.js ]; then
            echo "ERROR: Expected build output dist/server/server.js not found"
            ls -la dist/ || echo "dist/ directory does not exist"
            exit 1
          fi
          echo "Build output verified: dist/server/server.js exists"

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

  supply-chain-security:
    name: 2. Supply Chain Security & Container Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.18.0
        with:
          format: spdx-json
          output-file: 'sbom.spdx.json'

      - name: Run Container Security Vulnerability Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947e7f3b01245f6dc09 # v0.31.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  deploy-vercel:
    name: 3. Vercel Deployment
    needs: [build-and-test, supply-chain-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

